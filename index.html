<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cámara de amigos</title>

  <style>
    body {
      margin: 0;
      padding: 25px 15px;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .box {
      max-width: 650px;
      margin: auto;
      background: #1d1d1d;
      padding: 20px;
      border-radius: 16px;
    }

    button {
      padding: 14px 18px;
      margin: 8px;
      border: 0;
      border-radius: 12px;
      font-size: 16px;
    }

    #shareBtn {
      background: #2196f3;
      color: white;
    }

    #stopBtn {
      background: #e53935;
      color: white;
      display: none;
    }

    video {
      width: 100%;
      max-width: 600px;
      margin-top: 20px;
      border-radius: 15px;
      background: black;
    }

    #linkBox {
      display: none;
      margin-top: 20px;
      padding: 15px;
      background: #292929;
      border-radius: 12px;
      word-break: break-all;
    }

    #status {
      margin-top: 15px;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>😎 Cámara de amigos</h1>

  <div id="shareMode">
    <p>
      Si querés compartir tu cámara, tocá el botón y
      aceptá el permiso del navegador.
    </p>

    <button id="shareBtn">📷 Compartir mi cámara</button>
    <button id="stopBtn">⛔ Dejar de compartir</button>

    <div id="linkBox">
      <p>🔗 Mandale este enlace a la persona que va a ver tu cámara:</p>
      <strong id="shareLink"></strong>
    </div>

    <p id="shareStatus">Cámara sin activar.</p>

    <video id="localVideo" autoplay playsinline muted></video>
  </div>

  <div id="viewMode" style="display:none">

    <h2>📺 Cámara del amigo</h2>

    <p id="viewStatus">Esperando conexión...</p>

    <video id="remoteVideo" autoplay playsinline controls></video>

  </div>

</div>

<script>

const SERVER = "wss://camara-03m8.onrender.com";

const params = new URLSearchParams(window.location.search);
const mode = params.get("mode");
const room = params.get("room");

const shareMode = document.getElementById("shareMode");
const viewMode = document.getElementById("viewMode");

const shareBtn = document.getElementById("shareBtn");
const stopBtn = document.getElementById("stopBtn");

const localVideo = document.getElementById("localVideo");
const remoteVideo = document.getElementById("remoteVideo");

const shareStatus = document.getElementById("shareStatus");
const viewStatus = document.getElementById("viewStatus");

const linkBox = document.getElementById("linkBox");
const shareLink = document.getElementById("shareLink");

let socket;
let peer;
let localStream = null;


/* =========================
   MODO COMPARTIR
========================= */

if (mode === "share") {

  shareMode.style.display = "block";
  viewMode.style.display = "none";

  const roomId = room || Math.random().toString(36).substring(2, 10);

  shareBtn.addEventListener("click", async () => {

    try {

      shareStatus.textContent = "🟡 Pidiendo permiso de cámara...";

      localStream = await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: false
      });

      localVideo.srcObject = localStream;

      shareBtn.style.display = "none";
      stopBtn.style.display = "inline-block";

      shareStatus.textContent = "🟢 Cámara compartida.";

      const viewerLink =
        window.location.origin +
        window.location.pathname +
        "?mode=view&room=" +
        encodeURIComponent(roomId);

      shareLink.textContent = viewerLink;
      linkBox.style.display = "block";

      socket = new WebSocket(SERVER);

      socket.onopen = () => {

        socket.send(JSON.stringify({
          type: "join",
          room: roomId
        }));

        shareStatus.textContent =
          "🟢 Cámara activa. Esperando al espectador...";
      };

      socket.onmessage = async (event) => {

        const message = JSON.parse(event.data);

        if (message.type === "peer-joined") {

          createPeer();

          const offer = await peer.createOffer();

          await peer.setLocalDescription(offer);

          socket.send(JSON.stringify({
            type: "offer",
            offer: offer
          }));
        }

        if (message.type === "answer") {

          await peer.setRemoteDescription(
            new RTCSessionDescription(message.answer)
          );
        }

        if (message.type === "candidate") {

          if (peer) {

            try {
              await peer.addIceCandidate(
                new RTCIceCandidate(message.candidate)
              );
            } catch (error) {
              console.log(error);
            }

          }
        }

      };

    } catch (error) {

      console.error(error);

      shareStatus.textContent =
        "🔴 No se concedió el permiso de cámara.";

    }

  });

  stopBtn.addEventListener("click", () => {

    if (localStream) {

      localStream.getTracks().forEach(track => track.stop());
      localStream = null;

    }

    if (peer) {
      peer.close();
      peer = null;
    }

    if (socket) {
      socket.close();
      socket = null;
    }

    localVideo.srcObject = null;

    shareStatus.textContent = "⚫ Dejaste de compartir.";

    stopBtn.style.display = "none";
    shareBtn.style.display = "inline-block";

    linkBox.style.display = "none";

  });

}


/* =========================
   MODO VER
========================= */

else if (mode === "view" && room) {

  shareMode.style.display = "none";
  viewMode.style.display = "block";

  socket = new WebSocket(SERVER);

  socket.onopen = () => {

    viewStatus.textContent =
      "🟡 Conectando con la cámara...";

    socket.send(JSON.stringify({
      type: "join",
      room: room
    }));

    createPeer();

  };

  socket.onmessage = async (event) => {

    const message = JSON.parse(event.data);

    if (message.type === "offer") {

      await peer.setRemoteDescription(
        new RTCSessionDescription(message.offer)
      );

      const answer = await peer.createAnswer();

      await peer.setLocalDescription(answer);

      socket.send(JSON.stringify({
        type: "answer",
        answer: answer
      }));

      viewStatus.textContent =
        "🟢 Conectado. Recibiendo cámara...";
    }

    if (message.type === "candidate") {

      try {

        await peer.addIceCandidate(
          new RTCIceCandidate(message.candidate)
        );

      } catch (error) {
        console.log(error);
      }

    }

  };

}


/* =========================
   WEBRTC
========================= */

function createPeer() {

  peer = new RTCPeerConnection({
    iceServers: [
      {
        urls: "stun:stun.l.google.com:19302"
      }
    ]
  });

  if (localStream) {

    localStream.getTracks().forEach(track => {

      peer.addTrack(track, localStream);

    });

  }

  peer.onicecandidate = (event) => {

    if (event.candidate && socket) {

      socket.send(JSON.stringify({
        type: "candidate",
        candidate: event.candidate
      }));

    }

  };

  peer.ontrack = (event) => {

    remoteVideo.srcObject = event.streams[0];

    viewStatus.textContent =
      "🟢 Cámara recibida.";

  };

}

</script>

</body>
</html>
