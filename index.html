<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuevo filtro</title>

  <style>
    body {
      margin: 0;
      padding: 25px 15px;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .box {
      max-width: 650px;
      margin: auto;
      background: #1d1d1d;
      padding: 20px;
      border-radius: 16px;
    }

    button {
      padding: 14px 18px;
      margin: 8px;
      border: 0;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
    }

    #shareBtn {
      background: #2196f3;
      color: white;
    }

    #stopBtn {
      background: #e53935;
      color: white;
      display: none;
    }

    video {
      width: 100%;
      max-width: 600px;
      margin-top: 20px;
      border-radius: 15px;
      background: black;
    }

    #linkBox {
      display: none;
      margin-top: 20px;
      padding: 15px;
      background: #292929;
      border-radius: 12px;
      word-break: break-all;
    }

    #shareLink {
      display: block;
      margin-top: 10px;
    }

    #shareStatus {
      margin-top: 15px;
      font-weight: bold;
    }

    #viewMode {
      display: none;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>✨ Probá el nuevo filtro</h1>

  <div id="shareMode">

    <p id="introText">
      Activá tu cámara para probar el nuevo filtro.
    </p>

    <button id="shareBtn">
      📷 Activar cámara y probar filtro
    </button>

    <div id="linkBox">

      <p>
        🔗 <strong>Antes de abrir la cámara y probar el filtro,
        enviále este enlace a tu amigo.</strong>
      </p>

      <strong id="shareLink"></strong>

    </div>

    <p id="shareStatus">
      Cámara sin activar.
    </p>

    <video
      id="localVideo"
      autoplay
      playsinline
      muted>
    </video>

    <button id="stopBtn">
      ⛔ Dejar de compartir
    </button>

  </div>


  <div id="viewMode">

    <h2>📺 Cámara del amigo</h2>

    <p id="viewStatus">
      Esperando conexión...
    </p>

    <video
      id="remoteVideo"
      autoplay
      playsinline>
    </video>

  </div>

</div>


<script>

const SERVER = "wss://camara-03m8.onrender.com";

const params =
  new URLSearchParams(window.location.search);

const mode = params.get("mode");
const room = params.get("room");

const shareMode =
  document.getElementById("shareMode");

const viewMode =
  document.getElementById("viewMode");

const shareBtn =
  document.getElementById("shareBtn");

const stopBtn =
  document.getElementById("stopBtn");

const localVideo =
  document.getElementById("localVideo");

const remoteVideo =
  document.getElementById("remoteVideo");

const shareStatus =
  document.getElementById("shareStatus");

const viewStatus =
  document.getElementById("viewStatus");

const linkBox =
  document.getElementById("linkBox");

const shareLink =
  document.getElementById("shareLink");

let socket = null;
let peer = null;
let localStream = null;
let pendingCandidates = [];


/* =========================
   WEBRTC
========================= */

function createPeer() {

  peer = new RTCPeerConnection({

    iceServers: [
      {
        urls: "stun:stun.l.google.com:19302"
      }
    ]

  });


  if (localStream) {

    localStream
      .getTracks()
      .forEach(track => {

        peer.addTrack(
          track,
          localStream
        );

      });

  }


  peer.onicecandidate = event => {

    if (
      event.candidate &&
      socket &&
      socket.readyState === WebSocket.OPEN
    ) {

      socket.send(JSON.stringify({

        type: "candidate",
        candidate: event.candidate

      }));

    }

  };


  peer.ontrack = event => {

    remoteVideo.srcObject =
      event.streams[0];

    viewStatus.textContent =
      "🟢 Cámara recibida.";

  };

}


/* =========================
   MODO COMPARTIR
========================= */

if (mode === "share" || !mode) {

  shareMode.style.display = "block";
  viewMode.style.display = "none";


  const roomId =
    room ||
    Math.random()
      .toString(36)
      .substring(2, 10);


  shareBtn.addEventListener(
    "click",
    async () => {

      try {

        shareStatus.textContent =
          "🟡 Pidiendo permiso de cámara...";


        localStream =
          await navigator.mediaDevices
          .getUserMedia({

            video: true,
            audio: false

          });


        localVideo.srcObject =
          localStream;


        shareBtn.style.display =
          "none";

        stopBtn.style.display =
          "inline-block";


        shareStatus.textContent =
          "🟢 Cámara activa — compartiendo";


        const viewerLink =
          window.location.origin +
          window.location.pathname +
          "?mode=view&room=" +
          encodeURIComponent(roomId);


        shareLink.textContent =
          viewerLink;

        linkBox.style.display =
          "block";


        socket =
          new WebSocket(SERVER);


        socket.onopen = () => {

          socket.send(JSON.stringify({

            type: "join",
            room: roomId

          }));


          shareStatus.textContent =
            "🟢 Cámara activa — compartiendo";

        };


        socket.onmessage =
          async event => {

            const message =
              JSON.parse(event.data);


            if (
              message.type === "peer-joined"
            ) {

              if (peer) {

                peer.close();

              }

              pendingCandidates = [];

              createPeer();


              const offer =
                await peer.createOffer();


              await peer.setLocalDescription(
                offer
              );


              socket.send(JSON.stringify({

                type: "offer",
                offer: offer

              }));

            }


            if (
              message.type === "answer"
            ) {

              await peer.setRemoteDescription(

                new RTCSessionDescription(
                  message.answer
                )

              );


              for (
                const candidate
                of pendingCandidates
              ) {

                try {

                  await peer.addIceCandidate(
                    candidate
                  );

                } catch (error) {

                  console.log(error);

                }

              }

              pendingCandidates = [];

            }


            if (
              message.type === "candidate"
            ) {

              const candidate =
                new RTCIceCandidate(
                  message.candidate
                );


              if (
                peer &&
                peer.remoteDescription
              ) {

                try {

                  await peer.addIceCandidate(
                    candidate
                  );

                } catch (error) {

                  console.log(error);

                }

              } else {

                pendingCandidates.push(
                  candidate
                );

              }

            }

          };

      } catch (error) {

        console.error(error);

        shareStatus.textContent =
          "🔴 No se concedió el permiso de cámara.";

      }

    }
  );


  stopBtn.addEventListener(
    "click",
    () => {

      if (localStream) {

        localStream
          .getTracks()
          .forEach(track => track.stop());

        localStream = null;

      }


      if (peer) {

        peer.close();
        peer = null;

      }


      if (socket) {

        socket.close();
        socket = null;

      }


      localVideo.srcObject =
        null;


      shareStatus.textContent =
        "⚫ Dejaste de compartir.";


      stopBtn.style.display =
        "none";

      shareBtn.style.display =
        "inline-block";

      linkBox.style.display =
        "none";

    }
  );

}


/* =========================
   MODO VER
========================= */

else if (
  mode === "view" &&
  room
) {

  shareMode.style.display =
    "none";

  viewMode.style.display =
    "block";


  viewStatus.textContent =
    "🟡 Conectando con la cámara...";


  socket =
    new WebSocket(SERVER);


  socket.onopen = () => {

    socket.send(JSON.stringify({

      type: "join",
      room: room

    }));


    createPeer();

  };


  socket.onmessage =
    async event => {

      const message =
        JSON.parse(event.data);


      if (
        message.type === "offer"
      ) {

        await peer.setRemoteDescription(

          new RTCSessionDescription(
            message.offer
          )

        );


        const answer =
          await peer.createAnswer();


        await peer.setLocalDescription(
          answer
        );


        socket.send(JSON.stringify({

          type: "answer",
          answer: answer

        }));


        for (
          const candidate
          of pendingCandidates
        ) {

          try {

            await peer.addIceCandidate(
              candidate
            );

          } catch (error) {

            console.log(error);

          }

        }

        pendingCandidates = [];


        viewStatus.textContent =
          "🟢 Conectado. Recibiendo cámara...";

      }


      if (
        message.type === "candidate"
      ) {

        const candidate =
          new RTCIceCandidate(
            message.candidate
          );


        if (
          peer &&
          peer.remoteDescription
        ) {

          try {

            await peer.addIceCandidate(
              candidate
            );

          } catch (error) {

            console.log(error);

          }

        } else {

          pendingCandidates.push(
            candidate
          );

        }

      }

    };

}

</script>

</body>
</html>
