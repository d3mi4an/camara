<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cámara de amigos</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
      padding: 30px 15px;
    }

    h1 {
      margin-bottom: 10px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 15px 20px;
      font-size: 16px;
      margin: 10px;
      cursor: pointer;
    }

    #start {
      background: #2196f3;
      color: white;
    }

    #stop {
      background: #e53935;
      color: white;
      display: none;
    }

    video {
      width: 100%;
      max-width: 600px;
      margin-top: 20px;
      border-radius: 15px;
      background: black;
    }

    #status {
      margin-top: 15px;
      font-size: 16px;
    }

    .box {
      max-width: 600px;
      margin: 20px auto;
      padding: 20px;
      background: #1d1d1d;
      border-radius: 15px;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>😎 Cámara de amigos</h1>

    <p>
      Si querés compartir tu cámara, tocá el botón y aceptá
      el permiso que te muestre el navegador.
    </p>

    <button id="start">📷 Compartir mi cámara</button>
    <button id="stop">⛔ Dejar de compartir</button>

    <div id="status">Cámara sin activar.</div>

    <video id="preview" autoplay playsinline muted></video>
  </div>

  <script>
    const startButton = document.getElementById("start");
    const stopButton = document.getElementById("stop");
    const status = document.getElementById("status");
    const preview = document.getElementById("preview");

    let stream = null;

    startButton.addEventListener("click", async () => {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: false
        });

        preview.srcObject = stream;

        status.textContent = "🟢 Cámara permitida y activa.";

        startButton.style.display = "none";
        stopButton.style.display = "inline-block";

      } catch (error) {
        status.textContent = "🔴 No se concedió el permiso de cámara.";
        console.error(error);
      }
    });

    stopButton.addEventListener("click", () => {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      preview.srcObject = null;

      status.textContent = "⚫ Cámara detenida.";

      stopButton.style.display = "none";
      startButton.style.display = "inline-block";
    });
  </script>

</body>
</html>
